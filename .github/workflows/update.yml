name: Update GPU prices

on:
  schedule:
    # Every 30 minutes (UTC). GitHub may delay scheduled runs under load.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}        # allow manual "Run workflow"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/curated.json"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and rebuild data
        run: python scripts/fetch_prices.py

      - name: Commit refreshed data
        run: |
          git config user.name  "gpu-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/prices.js data/history.json data/history.js
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh prices ($(date -u +%FT%TZ))"
            git push
          fi
